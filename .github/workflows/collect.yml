# 자동 수집. 이 PC가 꺼져 있어도 GitHub 서버에서 돈다. (공개 저장소는 실행 시간이 무료)
# - 15분마다 "빠른 수집": 24개 채널의 새 영상 자막 받기 + 새로 입력한 키워드의 그 밖의 채널 검색
# - 매일 새벽 6시(한국 시간) "전체 수집": 모든 키워드를 다시 검색하고 14일 지난 영상 삭제
# 접속 정보는 저장소 Settings > Secrets and variables > Actions의 비밀 값 3개(YOUTUBE_API_KEY, SUPABASE_URL, SUPABASE_SECRET_KEY)를 쓴다.
# 직접 돌려 보려면 Actions 탭에서 이 작업을 골라 "Run workflow"를 누른다. (args 칸: 빈칸 = 전체, --quick, --limit 5 등)
name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 21 * * *" # 한국 시간 06:00
  workflow_dispatch:
    inputs:
      args:
        description: "수집 옵션 (예: --quick, --limit 5)"
        required: false
        default: "--quick"

# 겹쳐 돌지 않게 한다. 앞의 수집이 아직 돌고 있으면 다음 수집은 건너뛴다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 수집 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # 새벽 6시 실행은 전체 수집, 그 밖의 15분 실행은 빠른 수집, 손으로 돌릴 때는 입력한 옵션
          ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.args || (github.event.schedule == '0 21 * * *' && '' || '--quick') }}
        run: npx tsx scripts/collect.ts $ARGS
