# 임시 시험용: 작업 브랜치에 푸시하면 클라우드에서 자막을 5개만 받아 본다. 시험이 끝나면 지운다.
name: collect-test
on:
  push:
    branches: [feature/batch-expire-delete]
    paths: [".github/workflows/collect-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 수집 시험 (자막 5개)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/collect.ts --quick --limit 5
